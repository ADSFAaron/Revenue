# Basic checks on every push and pull request.
#
# Deliberately just the two things that were already being run by hand —
# `flutter analyze` and `flutter test` — plus a type-check of the Cloud
# Functions, which had no automated check at all. This is not a release
# pipeline: nothing here signs, uploads or deploys anything.
#
# The Flutter version is pinned rather than tracking `stable`, so a change in
# CI's result always means a change in this repository. Bump it deliberately,
# together with the SDK constraint in pubspec.yaml.
name: CI

on:
  push:
    branches: [main, v3]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: flutter pub get

      # Plain `flutter analyze`, which already exits non-zero on an info —
      # analysis_options.yaml is what decides what counts, and the one lint
      # this repository can never satisfy (`package_names`) is turned off
      # there with its reason. So a red build here means something new.
      - run: flutter analyze

      - run: flutter test

  functions:
    name: functions typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        working-directory: functions

      # The same compiler the Firebase predeploy hook runs, so a deploy cannot
      # be the first thing that discovers a type error.
      - run: ./node_modules/.bin/tsc --noEmit
        working-directory: functions

      # `functions/test/` had been here for a while with nothing running it, so
      # the two things it covers — the closed-set match that stops a model
      # inventing a dish, and the retry ladder's arithmetic — were only ever
      # checked by hand. Both are the kind of mistake that reads as correct.
      # `npm test` builds first: the tests require the compiled `lib/`.
      - run: npm test
        working-directory: functions

  rules:
    name: firestore rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/rules/package-lock.json

      # The Firestore emulator is a Java program. Pinned rather than relying on
      # whatever the runner image happens to ship.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
        working-directory: test/rules

      # Starts an emulator, runs the suite against it, shuts it down, and exits
      # with the suite's code. firestore.rules is the one file in this project
      # that fails silently: a mistake in it does not throw, it lets somebody
      # read a shop's takings.
      - run: npm run emulate
        working-directory: test/rules

  # Would the tests notice if this change were wrong?
  #
  # Coverage answers a different and much weaker question — whether a line ran.
  # Strip every assertion out of a suite and the coverage barely moves, so a
  # high number says nothing about whether behaviour is checked. This injects
  # real defects into the lines a pull request touches and reports which ones
  # no test objected to.
  #
  # It earned its place before it was written: run by hand over this project it
  # found two blind spots in a suite that was otherwise catching 17 of 19
  # planted bugs, and one of them was on the five-minute correction window —
  # the rule that decides who may move money.
  #
  # Incremental on purpose. Mutating the whole project would take hours and
  # bury the answer; Google's own experience of running this at scale is that
  # the working version mutates only what a change touched. Advisory, for the
  # same reason the strict analyser is: a surviving mutant is a question worth
  # asking, not a reason to stop somebody shipping.
  mutation:
    name: mutation analysis (advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base has to exist locally for the diff below to work.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: flutter pub get

      # Installed globally rather than added to pubspec: mutation_test needs
      # `xml ^6`, excel_plus needs `xml ^7`, and there is no version of this
      # project that can hold both. As a separate binary it resolves its own
      # dependencies and the conflict never arises.
      - run: dart pub global activate mutation_test

      - name: Mutate what this pull request changed
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          files=$(git diff --name-only "$base"...HEAD -- 'lib/**/*.dart' | tr '\n' ' ')
          if [ -z "$files" ]; then
            echo "No Dart files under lib/ changed — nothing to mutate."
            exit 0
          fi
          echo "Mutating: $files"
          dart pub global run mutation_test \
            --rules tool/mutation_rules.xml \
            --no-builtin \
            $files

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: mutation-test-report/
          if-no-files-found: ignore

  # Advisory only. `continue-on-error` means this can never fail a build or
  # hold up a release — it is here to notice things, not to stop work. See the
  # header of analysis_options.strict.yaml for what it turns on and what was
  # measured and deliberately left off.
  strict:
    name: strict analysis (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: flutter pub get

      # The analyzer reads analysis_options.yaml from the project root and
      # takes no path argument, so the stricter view is applied by replacing
      # that file. Safe here because the checkout is thrown away.
      - run: cp analysis_options.strict.yaml analysis_options.yaml

      - run: flutter analyze
