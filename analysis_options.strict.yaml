# A stricter view of the same code, and deliberately NOT what CI gates on.
#
# `flutter analyze` in the main job reads analysis_options.yaml and is allowed
# to fail a build. This file is advisory: the workflow copies it over that one
# on a throwaway checkout, runs the analyzer again, and reports without ever
# blocking a merge or a release. Lints are a way of noticing things, not a way
# of stopping work.
#
# Everything enabled here passes today. That is the point — a file that always
# reports something teaches people to ignore it, so a finding means something
# changed rather than something was always so. Promote a rule into
# analysis_options.yaml when it has earned it; add one here first.
#
# What was measured and deliberately left out (2026-09-03):
#
#   strict-inference     25 findings, 22 of them `MaterialPageRoute` without an
#                        explicit type argument. Idiomatic Flutter navigation,
#                        not a defect.
#   discarded_futures    58 findings. Every `onTap: () => something()` trips it
#                        in a Flutter app.
#   no_adjacent_strings_in_list
#                        2 findings, both false: strings split across lines on
#                        purpose in store_import_orders.dart, not a forgotten
#                        comma.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Same exclusions as analysis_options.yaml, which CI replaces with this file
  # — without them the advisory job would analyze directories the gating one
  # never sees, and report findings nobody can act on.
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
  language:
    # The one that matters most here. Firestore hands back
    # `Map<String, dynamic>` and every model parses out of it, so an implicit
    # `dynamic` -> `T` cast is this project's most likely runtime crash. Zero
    # findings, which is worth keeping true.
    strict-casts: true
    # Raw generics at the boundaries where untyped data arrives. Four were
    # found and fixed the day this file was written, all of them exactly there
    # — a callable result, two JSON decodes, a Firestore array.
    strict-raw-types: true

linter:
  rules:
    package_names: false

    # Bug-shaped rules, all currently clean.
    unawaited_futures: true
    avoid_dynamic_calls: true
    cancel_subscriptions: true
    close_sinks: true
    throw_in_finally: true
    unnecessary_statements: true
    test_types_in_equals: true
    literal_only_boolean_expressions: true
    avoid_returning_null_for_void: true
    avoid_slow_async_io: true

    # Style, but the kind that prevents a class of mistake rather than tidying.
    always_declare_return_types: true
    prefer_final_locals: true
