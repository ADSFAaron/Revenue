
plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.adsf.revenue'
    compileSdk flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion
//    ndkVersion = "27.0.12077973"

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.adsf.revenue"
        minSdk 27
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        // 32-bit x86 is gone. No phone has ever shipped it in a market this
        // app serves, and the only things that run it are old emulator images
        // — which x86_64 already covers. Play splits an app bundle per ABI, so
        // this does not change what any device downloads; it changes what has
        // to be compiled, uploaded and stored.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // The upload keystore when android/key.properties exists, the debug
            // keys when it does not.
            //
            // This used to read `signingConfig signingConfigs.debug`, with the
            // real config commented out below it — so shipping meant editing
            // this file, and forgetting to edit it meant uploading an artifact
            // Play rejects. Worse, it rejects it *after* the upload, by which
            // time the version code is spent. Choosing on the presence of the
            // key file means the decision is made by whether the key is there,
            // which is the thing that actually determines the answer.
            //
            // `flutter run --release` on a machine with no key.properties still
            // works, exactly as before.
            signingConfig keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug

            // R8, which was off. It shrinks and obfuscates the Java/Kotlin half
            // of the app — Dart is already AOT-compiled and untouched by this,
            // but Firebase, Play Core, CameraX and Credential Manager are all
            // real Android libraries and most of each one is unreachable.
            //
            // proguard-rules.pro carries the keeps this needs; read it before
            // changing anything here.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
        }
    }



}

// AGP 9 removed the `android.kotlinOptions` block this used to live in. Same
// setting, moved to the Kotlin plugin's own extension at the top level.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

apply plugin: 'com.google.gms.google-services'