# 1536M was not enough to get through JetifyTransform on the Flutter engine
# jars once the passkeys / google_sign_in / cloud_functions plugins joined the
# classpath — Gradle died with "Java heap space" before compiling a line.
org.gradle.jvmargs=-Xmx4096M
android.useAndroidX=true
android.enableJetifier=true
# Written by Flutter's migrator as `false`, an opt-out of the AGP 9 default that
# Flutter will remove in a future version. Turned on now that app/build.gradle
# has stopped applying the Kotlin Gradle Plugin, so the app is no longer sitting
# on that shim.
android.builtInKotlin=true
# Still opted out, and separate from the above: this one governs AGP 9's new DSL
# and the migration guide leaves it false.
android.newDsl=false
