name: Revenue
description: An app for Revenue Statistics and Management

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 3.0.0+3

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # iOS style icons.
  cupertino_icons: ^1.0.8

  # Online Database for data
  cloud_firestore: ^6.9.0
  firebase_core: ^4.14.0

  # Firebase Authentication
  firebase_auth: ^6.6.1

  # Using for SVG Asset
  flutter_svg: ^2.0.17

  # Use for Page Animation
  simple_animations: ^5.1.0

  # Use for getting clock
  intl: ^0.20.3

  # Use for App Drawer
  flutter_launcher_icons: ^0.14.3

  # Use for opening app splash screen
  #
  # Held at 2.4.4, which is not a preference. 2.4.6 moved to `image ^4.5.4`,
  # which needs `archive ^4`, and `excel` pins `archive ^3.6.1` — so the
  # exporter and the splash generator cannot both be current. excel 4.0.6 is
  # the latest and has not been published since August 2024, so this resolves
  # when the Excel export moves off it, not before. Nothing is lost meanwhile:
  # this package only runs by hand, via `dart run flutter_native_splash:create`.
  flutter_native_splash: ^2.4.4

  # Charts on the Reports page.
  #
  # `syncfusion_flutter_charts` was here and is not a free package: it ships
  # under a commercial licence with a Community exemption that only holds while
  # the organisation is under a million dollars of revenue and under five
  # developers. That is a condition on the *company*, not on the code, so it can
  # stop being true without anybody touching a line — a poor thing to have
  # underneath a shop's reports. fl_chart is MIT.
  #
  # There is no first-party option to compare against: Google archived
  # `charts_flutter` in January 2023.
  fl_chart: ^1.1.1

  # Use for output Excel file
  excel: ^4.0.6

  # Use for locating where an exported Excel file may be written
  path_provider: ^2.1.5

  # Use for history order grouped
  grouped_list: ^6.0.0

  # Use for showing app info.
  # 9.x was the floor `passkeys` pulls in through passkeys_doctor, and it cost
  # the Android Gradle Plugin bump to 8.12.1 in android/settings.gradle. 10.x
  # is free on top of that: the `PackageInfo.fromPlatform()` call this app
  # makes is unchanged across both majors.
  package_info_plus: ^10.2.1

  # Remembers the light/dark choice between launches. The only thing this app
  # keeps on the device — everything else belongs to the store, not the phone.
  shared_preferences: ^2.3.3

  # Use for register generate uuid
  uuid: ^4.5.1

  # Google sign-in on Android. Web goes through firebase_auth's signInWithPopup
  # instead — google_sign_in_web cannot do a custom-button flow at all
  # (supportsAuthenticate() is false there and authenticate() throws).
  google_sign_in: ^7.2.0

  # Passkeys: the client half of the WebAuthn ceremony. The verifying half is
  # the relying party in functions/ — this package only signs challenges.
  passkeys: ^2.22.3

  # Calling that relying party. Firebase Auth has no passkey provider, so the
  # ceremony finishes with a Cloud Function minting a custom token.
  cloud_functions: ^6.4.0

  # Use for app name
  rename: ^3.0.2

  # Capturing a menu in-app rather than borrowing another app's camera.
  #
  # `image_picker`'s camera source fires ACTION_IMAGE_CAPTURE and hands the job
  # to whatever answers it. On a Sony Xperia nothing does — the stock camera is
  # disabled and its replacements (Photography Pro, camerax) register only
  # STILL_IMAGE_CAMERA, which opens a camera but never returns a picture. The
  # phone then reports `no_available_camera` while holding three cameras.
  # Driving the hardware directly is the only route that does not depend on
  # which camera app the manufacturer shipped.
  camera: ^0.12.0+2

  # Photographing a menu so it can be read into dishes. `maxWidth` downsamples
  # natively on the way out, which is why there is no separate `image` package:
  # a 1568px long edge is all the recogniser wants and a 12MP original is
  # several seconds of upload for no gain.
  image_picker: ^1.1.2

  # Dish icons are a hand-picked list in lib/widgets/dish_icons.dart, not a
  # picker over the whole font.
  #
  # `flutter_iconpicker` used to do this and stopped working without a single
  # line of this app changing: 4.0.2 moved the icon data out of the package
  # into a code generator and left `const defaultIcons = {}` behind, so a
  # `^4.0.1` that resolved to 4.0.3 opened a picker with nothing in it. Fifty
  # icons that are all food beat six thousand that are not, and being `const`
  # they also survive `--tree-shake-icons` in a release build, which a code
  # point read out of Firestore does not.
  material_symbols_icons: ^4.2811.0
  in_app_update: ^5.0.0
  url_launcher: ^6.3.2
  firebase_app_check: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0

# App icon.
#
# Every image below is derived from assets/icon/AppLogo.png by
# `python3 tool/logo_assets.py` — read that file before changing any path
# here. Backgrounds are `colorScheme.surface`, the same value the splash uses,
# so the icon and the launch screen are one surface (docs/design-tokens.md).
#
# Re-run after any change here: `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: "launcher_icon"
  # Opaque: an iOS app icon may not carry an alpha channel, and this same
  # square is what Android legacy, web and the desktop targets fall back to.
  image_path: "assets/icon/AppLogoIcon.png"
  min_sdk_android: 27 # android min sdk min:16, default 21
  adaptive_icon_background: "#F9FAEF"
  adaptive_icon_foreground: "assets/icon/AppLogoAdaptive.png"
  adaptive_icon_monochrome: "assets/icon/AppLogoMonochrome.png"
  # 0, because the padding is already in the two images above — tool/
  # logo_assets.py draws the mark at half the canvas so it sits comfortably
  # inside the circular mask rather than against it.
  # This used to be 64, which becomes `android:inset="64%"` on each side and
  # would have collapsed the foreground to nothing; it had never run, because
  # AppLogoMonochrome.png did not exist and the tool exits on a missing file.
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: false
  # iOS 18's dark and tinted icons composite over a ground the system draws,
  # so these are transparent and use the dark-mode pair.
  image_path_ios_dark_transparent: "assets/icon/AppLogoIconDark.png"
  image_path_ios_tinted_grayscale: "assets/icon/AppLogoIconDark.png"
  desaturate_tinted_to_grayscale_ios: true
  background_color_ios: "#F9FAEF"
  web:
    generate: true
    image_path: "assets/icon/AppLogoIcon.png"
    background_color: "#F9FAEF"
    theme_color: "#F9FAEF"
  windows:
    generate: true
    image_path: "assets/icon/AppLogoIcon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon/AppLogoIcon.png"

# Native splash screen.
#
# Colours are design tokens, not free choices — see docs/design-tokens.md.
# The background is `colorScheme.surface` in each mode (Warm Cream #F9FAEF /
# dark #12140E) so the launch screen and the first painted frame are the same
# colour and the handover is invisible. The previous values were #eae9e4 in
# this file and a cyan #54EFEF baked into every generated asset — the config
# had been edited without re-running the generator, so what shipped was the
# cyan.
#
# Re-run after any change here: `dart run flutter_native_splash:create`.
flutter_native_splash:
  # Web is handled by hand in web/index.html instead. The generator injects its
  # own <picture id="splash"> plus a `removeSplashFromWeb()` that only Flutter's
  # stock bootstrap calls — this app has a custom one (it has to load the
  # passkeys bundle first), so the generated splash would never be removed. It
  # also adds a second viewport meta carrying `user-scalable=no`, which takes
  # pinch-zoom away from the whole web app. The hand-written #loading overlay
  # already does this job, off the same two tokens.
  web: false
  color: "#F9FAEF"
  color_dark: "#12140E"
  # Both derived from assets/icon/AppLogo.png by `python3 tool/logo_assets.py`.
  # The dark copy is not a tint of the light one: the R is #4A672D, which on
  # #12140E is 1.9:1, so it moves to `primaryContainer` #CBEEA5 (14.4:1) while
  # the rays keep Growth Green.
  image: "assets/icon/AppLogoSplash.png"
  image_dark: "assets/icon/AppLogoSplashDark.png"
  # Android 12+ draws the splash itself and masks the icon to a circle 768px
  # across on a 1152px canvas. These two are pre-rendered to that spec; the
  # mark's own enclosing circle is 1.26x its width, so it is the circle and not
  # the bounding box that sets the size.
  android_12:
    color: "#F9FAEF"
    color_dark: "#12140E"
    image: "assets/icon/AppLogoAndroid12.png"
    image_dark: "assets/icon/AppLogoAndroid12Dark.png"

# The following section is specific to Flutter.
flutter:
  uses-material-design: true

  assets:
    - assets/welcome.svg
    - assets/login_bg.svg
    - assets/google-icon.svg

  # An images asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
