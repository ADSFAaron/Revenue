name: Revenue
description: An app for Revenue Statistics and Management

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # iOS style icons.
  cupertino_icons: ^1.0.8

  # Online Database for data
  cloud_firestore: ^5.6.6
  firebase_core: ^3.13.0

  # Firebase Authentication
  firebase_auth: ^5.5.2

  # Using for SVG Asset
  flutter_svg: ^2.0.17

  # Use for Page Animation
  simple_animations: ^5.1.0

  # Use for getting clock
  intl: ^0.19.0

  # Use for App Drawer
  flutter_launcher_icons: ^0.14.3

  # Use for opening app splash screen
  flutter_native_splash: ^2.4.4

  # Use for statistics graph
  syncfusion_flutter_gauges: ^29.1.35
  syncfusion_flutter_charts: ^29.1.35

  # Use for output Excel file
  excel: ^4.0.6

  # Use for locating where an exported Excel file may be written
  path_provider: ^2.1.5

  # Use for history order grouped
  grouped_list: ^6.0.0

  # Use for showing app info.
  # 9.x is the floor `passkeys` pulls in through passkeys_doctor; it costs an
  # Android Gradle Plugin bump to 8.12.1 (android/settings.gradle) and nothing
  # else — the PackageInfo API itself is unchanged.
  package_info_plus: ^9.0.1

  # Use for register generate uuid
  uuid: ^4.5.1

  # Google sign-in on Android. Web goes through firebase_auth's signInWithPopup
  # instead — google_sign_in_web cannot do a custom-button flow at all
  # (supportsAuthenticate() is false there and authenticate() throws).
  google_sign_in: ^7.2.0

  # Passkeys: the client half of the WebAuthn ceremony. The verifying half is
  # the relying party in functions/ — this package only signs challenges.
  passkeys: ^2.22.3

  # Calling that relying party. Firebase Auth has no passkey provider, so the
  # ceremony finishes with a Cloud Function minting a custom token.
  #
  # Held at 5.x deliberately: cloud_functions 6.x wants firebase_core ^4, and
  # moving to that would drag cloud_firestore and firebase_auth through a
  # major version each. Passkeys are not worth a stack-wide migration.
  cloud_functions: ^5.6.0

  # Use for app name
  rename: ^3.0.2

  # Use for edit menu icon
  flutter_iconpicker: ^4.0.1
  material_symbols_icons: ^4.2811.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  change_app_package_name: ^1.5.0

# App Icon
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "./assets/icon/AppLogo.png"
  min_sdk_android: 27 # android min sdk min:16, default 21
  adaptive_icon_background: "#eae9e4"
  adaptive_icon_foreground: "assets/icon/AppLogo.png"
  adaptive_icon_monochrome: "assets/icon/AppLogoMonochrome.png"
  adaptive_icon_foreground_inset: 64
  ios: true
  remove_alpha_ios: false
  image_path_ios_dark_transparent: "assets/icon/AppLogo.png"
  image_path_ios_tinted_grayscale: "assets/icon/AppLogo.png"
  desaturate_tinted_to_grayscale_ios: true
  background_color_ios: "#eae9e4"
  web:
    generate: true
    image_path: "assets/icon/AppLogo.png"
    background_color: "#eae9e4"
    theme_color: "#eae9e4"
  windows:
    generate: true
    image_path: "assets/icon/AppLogo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon/AppLogo.png"

flutter_native_splash:
  color: "#eae9e4"
  image: "assets/icon/AppLogo.png"
  android_12:
    image: "assets/icon/AppLogo.png"
    color: "#eae9e4"

# The following section is specific to Flutter.
flutter:
  uses-material-design: true

  assets:
    - assets/welcome.svg
    - assets/login_bg.svg
    - assets/google-gemini-icon.svg
    - assets/google-icon.svg

  # An images asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
