<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Sales bookkeeping and analysis for a small restaurant.">
  <!--
    The browser chrome follows `colorScheme.surface`, the same rule the native
    splash uses — see docs/design-tokens.md. Two tags rather than one because a
    manifest theme_color cannot vary by scheme.
  -->
  <meta name="theme-color" content="#F9FAEF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12140E" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Revenue">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Revenue</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      /* `colorScheme.surface`. The native splash, this overlay and the first
         frame Flutter paints are all this colour, so nothing flashes at the
         handover. Was #eae9e4, which belonged to no palette. */
      background-color: #F9FAEF;
      color-scheme: light dark;
    }

    /* Shown until the Flutter engine has a frame to paint. Without it the page
       is blank for the length of the download, which on a phone browser reads
       as a broken app. */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #4A672D;
    }

    #loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(74, 103, 45, 0.2);
      border-top-color: #4A672D;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #loading .spinner { animation-duration: 3s; }
    }

    /* The overlay is painted before any Dart runs, so it can only read the OS
       setting. The app's own light/dark/system choice takes over from the first
       frame — a phone set to dark with the app pinned to light sees one frame
       of dark here, which is still better than the cream-on-dark it would get
       without this block. */
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #12140E; }
      #loading { color: #B0D18B; }
      #loading .spinner {
        border-color: rgba(176, 209, 139, 0.2);
        border-top-color: #B0D18B;
      }
    }
  </style>
</head>
<body>
  <!--
    The Passkeys web SDK, vendored from
    https://github.com/corbado/flutter-passkeys/releases/download/2.4.0/bundle.js

    `passkeys_web`'s registerWith() ends in a bare `PasskeyAuthenticator.init()`
    against this global, and its own guard does not catch the miss: it probes
    with `window['PasskeyAuthenticator']`, which returns undefined rather than
    throwing, so the try/catch never fires and the call runs anyway. That is a
    TypeError inside registerPlugins(), which runs before main() — so without
    this tag the entire web build dies at startup with a blank page, passkeys
    or not. It must load before the Flutter bootstrap below.
  -->
  <script src="passkeys/bundle.js"></script>

  <div id="loading">
    <div class="spinner"></div>
    <div>Revenue</div>
  </div>

  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        document.getElementById('loading')?.remove();
        await appRunner.runApp();
      }
    });
  </script>
</body>
</html>
